apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredimagetags
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredImageTags
      validation:
        openAPIV3Schema:
          type: object
          properties:
            forbiddenTags:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredimagetags

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]
          image := container.image
          parts := split(image, ":")
          count(parts) > 1
          tag := parts[count(parts) - 1]
          tag == input.parameters.forbiddenTags[_]
          msg := sprintf("Image tag '%v' is forbidden: %v", [tag, image])
        }
